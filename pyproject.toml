[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-booking-api"
version = "0.1.0"
description = "API записи учеников к частным репетиторам"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.6,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]
